    <title>RCC Live Lecture</title>
    <!-- Google Sans and Google Sans Code from the Google Fonts API (OFL; GDG foundations.md §3.1, §3.9). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- With JavaScript off nothing replaces #root's Loading…, so hide it; the noscript line shows alone. -->
    <noscript><style>#root{display:none}</style></noscript>

  <body>
    <!-- Shows until the app's file runs; src/main.tsx's render replaces it. -->
    <div id="root"><main class="page"><p class="status status--loading" role="status">Loading…</p></main></div>
    <noscript><main class="page"><p class="status">Turn on JavaScript to use this page.</p></main></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
