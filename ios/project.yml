name: RCCLivePortal
options:
  bundleIdPrefix: com.samtg
  deploymentTarget:
    iOS: "18.0"
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    # ConvexMobile's simulator library is arm64 only. Without this line a build for
    # "Any iOS Simulator Device" (generic/platform=iOS Simulator) fails to link x86_64.
    # Simulator builds need an Apple Silicon Mac.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  RCCLivePortal:
    type: application
    platform: iOS
    sources:
      - path: RCCLivePortal
    dependencies:
      - package: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samtg.rccliveportal
        PRODUCT_NAME: RCCLivePortal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RCC Live
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
      # No ATS exception: App Transport Security doesn't cover ConvexMobile's websocket, so it
      # can't block or allow a plain-http backend. Config.accepts does: https only in Release,
      # http too in Debug, for a backend on this Mac (http://127.0.0.1:3210).
  # Unit tests for the follow rule, decoding, the late banner and the words. They run inside
  # the app, which opens no connection while tests run, so they need no backend.
  RCCLivePortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RCCLivePortalTests
    dependencies:
      - target: RCCLivePortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samtg.rccliveportal.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  RCCLivePortal:
    build:
      targets:
        RCCLivePortal: all
        RCCLivePortalTests: [test]
    run:
      config: Debug
      # Tick these in Edit Scheme > Run > Arguments and put your dev deployment's name in the URL.
      commandLineArguments:
        "-convexURL https://<dev deployment>.convex.cloud": false
        "-startOnSlide 2": false
    test:
      config: Debug
      targets:
        - RCCLivePortalTests
